<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Review Flow Demo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Review Flow <span>DEMO</span></a>
    {% if session.get('user_id') %}
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="link-button" type="submit">Sign out</button>
      </form>
    {% endif %}
  </header>
  <main class="container">
    {% for message in get_flashed_messages() %}
      <div class="notice" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>College project prototype · Reviews are simulated locally and are never sent to a review platform.</footer>
</body>
</html>
